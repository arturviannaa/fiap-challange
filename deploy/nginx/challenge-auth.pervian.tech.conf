# Servico de autenticacao (C++), em 127.0.0.1:8092.
server {
    listen 80;
    listen [::]:80;
    server_name challenge-auth.pervian.tech;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 16k;

    location ~ ^/conta/(login|cadastro|recuperar-senha|redefinir-senha)$ {
        limit_req zone=challenge_conta burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=challenge_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
