# Interface: HTML, CSS e JS estaticos, sem processo rodando.
server {
    listen 80;
    listen [::]:80;
    server_name challenge.pervian.tech;

    root /var/www/fiap-challange;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://challenge-auth.pervian.tech https://challenge-quiz.pervian.tech; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /img/ {
        add_header Cache-Control "public, max-age=604800";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
