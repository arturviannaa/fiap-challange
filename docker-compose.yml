# Sobe os tres servicos na maquina: http://localhost:8080
services:
  auth:
    build: ./auth
    environment:
      ORIGENS: http://localhost:8080,http://127.0.0.1:8080
      MODO_DEMO: "1"
    ports:
      - "8092:8092"
    volumes:
      - auth-dados:/app/var

  quiz:
    build: ./quiz
    environment:
      ORIGENS: http://localhost:8080,http://127.0.0.1:8080
      AUTH_URL: http://auth:8092
    ports:
      - "8093:8093"
    volumes:
      - quiz-dados:/app/var
    depends_on:
      - auth

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro

volumes:
  auth-dados:
  quiz-dados:
