<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quiz · Anamnea</title>
  <meta name="description" content="Responda uma questão por vez e veja a explicação na hora.">
  <meta name="theme-color" content="#f6f8fc">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Nunito:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/quiz.css">
  <script type="module" src="js/paginas/quiz.js"></script>
</head>
<body>
  <header class="licao-topo conteiner">
    <a class="icone-redondo" href="quizzes.html" aria-label="Sair do quiz e voltar para a lista">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </a>
    <progress class="trilho" id="progresso" aria-label="Questões respondidas" max="1" value="0"></progress>
    <span class="licao-contagem tabular" id="contagem" aria-hidden="true"></span>
  </header>

  <main id="conteudo" class="licao conteiner">
    <p id="carregando">Abrindo o quiz…</p>
    <p id="aviso" role="alert" hidden></p>

    <form id="questao" hidden>
      <fieldset>
        <legend>
          <span class="chip chip-info" id="rotulo-do-quiz"></span>
          <h1 class="enunciado" id="enunciado" tabindex="-1">Carregando a questão</h1>
        </legend>
        <div class="alternativas" id="alternativas"></div>
      </fieldset>
      <p class="regra-da-licao">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        A primeira resposta é a que vale. Depois de conferir, a escolha fica travada.
      </p>
    </form>

    <section class="resultado" id="resultado" aria-labelledby="titulo-resultado" hidden>
      <img id="vento-resultado" src="img/vento/comemorando.webp" alt="" width="667" height="854">
      <h1 id="titulo-resultado" tabindex="-1">Resultado</h1>
      <p id="mensagem-resultado"></p>
      <dl class="metricas">
        <div class="tile"><dt class="rotulo-do-tile">Acertos</dt><dd class="valor" id="acertos"></dd></div>
        <div class="tile"><dt class="rotulo-do-tile">XP ganho</dt><dd class="valor" id="xp-ganho"></dd></div>
        <div class="tile"><dt class="rotulo-do-tile">XP total</dt><dd class="valor" id="xp-total"></dd></div>
      </dl>
      <div class="acoes-do-resultado">
        <a class="btn btn-lg btn-acao" href="quizzes.html">Escolher outro quiz</a>
        <a class="btn btn-lg btn-contorno" id="refazer" href="">Refazer este quiz</a>
      </div>
    </section>
  </main>

  <div class="painel-licao" id="painel" hidden>
    <div class="conteiner painel-conteudo">
      <div class="painel-acoes" id="acoes">
        <button class="btn btn-contorno" type="button" id="nao-sei">Não sei</button>
        <button class="btn btn-lg btn-acao" type="submit" form="questao" id="conferir" disabled>Conferir</button>
      </div>

      <div class="veredito" id="veredito" role="status" hidden>
        <img id="vento-veredito" src="img/vento/joinha.webp" alt="" width="595" height="873">
        <span class="icone-redondo" id="icone-veredito" aria-hidden="true"></span>
        <div>
          <p class="veredito-titulo" id="titulo-veredito"></p>
          <p class="veredito-explicacao" id="explicacao"></p>
        </div>
      </div>
      <button class="btn btn-lg" type="button" id="continuar" hidden>Continuar</button>
    </div>
  </div>
</body>
</html>
