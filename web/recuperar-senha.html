<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recuperar senha · Anamnea</title>
  <meta name="description" content="Receba um código de 6 dígitos e defina uma senha nova.">
  <meta name="theme-color" content="#1a3a9e">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Nunito:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/layout.css">
  <script type="module" src="js/paginas/recuperar-senha.js"></script>
</head>
<body>
  <div class="conta">
    <aside class="conta-lado">
      <a class="marca marca-clara" href="./" aria-label="Anamnea, página inicial">
        <span class="marca-simbolo" aria-hidden="true">A</span>
        <span>Anamnea</span>
      </a>
      <div class="conta-lado-texto">
        <h2>Dois passos e você volta a estudar.</h2>
        <p>Primeiro o e-mail, depois o código de 6 dígitos com a senha nova. O código vale por 15 minutos.</p>
      </div>
      <img class="conta-lado-texto" src="img/vento/lendo.webp" alt="" width="512" height="818">
    </aside>

    <main class="conta-principal">
      <div class="conta-formulario">
        <h1 id="titulo" tabindex="-1">Recuperar senha</h1>
        <p id="subtitulo">Informe o e-mail da sua conta para receber um código.</p>

        <form id="pedido" novalidate aria-label="Pedir código">
          <p id="aviso-pedido" role="alert" hidden></p>
          <div class="campo-grupo">
            <label class="rotulo" for="email">E-mail</label>
            <input class="campo" id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
          </div>
          <button class="btn btn-lg btn-acao btn-bloco" type="submit">Enviar código</button>
        </form>

        <form id="redefinicao" novalidate aria-label="Trocar senha" hidden>
          <p id="aviso-redefinicao" role="alert" hidden></p>
          <div class="campo-grupo">
            <label class="rotulo" for="codigo">Código de 6 dígitos</label>
            <input class="campo campo-codigo" id="codigo" name="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
          </div>
          <div class="campo-grupo">
            <label class="rotulo" for="nova-senha">Senha nova</label>
            <div class="campo-senha">
              <input class="campo" id="nova-senha" name="nova_senha" type="password" autocomplete="new-password" aria-describedby="dica-senha" required>
              <button class="campo-senha-botao" type="button" aria-controls="nova-senha" aria-pressed="false" aria-label="Mostrar senha"></button>
            </div>
            <p class="dica" id="dica-senha">Pelo menos 8 caracteres, com letras e números.</p>
          </div>
          <button class="btn btn-lg btn-acao btn-bloco" type="submit">Trocar senha</button>
          <p class="conta-rodape"><button class="btn btn-sm btn-texto" type="button" id="outro-email">Usar outro e-mail</button></p>
        </form>

        <p class="conta-rodape">Lembrou? <a href="entrar.html">Entrar</a></p>
      </div>
    </main>
  </div>
</body>
</html>
